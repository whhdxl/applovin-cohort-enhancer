<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AppLovin 增强列 · 本地演示</title>
<link rel="stylesheet" href="/demo/demo.css"><link rel="stylesheet" href="/extension/styles.css"></head>
<body><aside><b>APPLOVIN</b><p>演示工作区</p><nav>Campaigns<br><strong>Reports</strong><br>Assets</nav></aside><main>
<header><span>Analytics / Reports</span><small>合成数据 · 不连接 AppLovin</small></header>
<h1>Reports</h1><p class="intro">同期群指标增强演示。点击「增强列」选择指标、查看依赖并设置颜色。</p>
<section class="filters"><div><small>Date range</small><b>Sep 07 – Sep 13, 2026</b></div><div><small>Group by</small><b>Week / Campaign</b></div><button id="run">Run</button></section>
<section data-testid="report-table-area"><div class="report-tools"><div><button id="columns">Columns</button></div><div><label><input type="radio" name="mode" checked>Cohort</label><label><input type="radio" name="mode">Real time</label></div></div><div id="table"></div></section>
<p class="help">Columns：切换付费人数字段，观察依赖列隐藏及恢复。Run：更新合成数据。横向滚动查看增强列。问号表示成熟度待确认。</p>
</main><script src="/demo/demo.js"></script><script src="/extension/core.js"></script><script src="/extension/adapter.js"></script><script src="/extension/ui.js"></script><script src="/extension/content.js"></script></body></html>
